AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Private Windows Server 2022 developer workstation for Kiro IDE/CLI.
  No public IP and no inbound security-group rules. Administrative access
  is intended through AWS Systems Manager Fleet Manager Remote Desktop.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment used in resource names and tags.

  InstanceType:
    Type: String
    Default: t3.large
    Description: EC2 instance type for the Windows workstation.

  VolumeSize:
    Type: Number
    Default: 100
    MinValue: 30
    MaxValue: 16384
    Description: Root gp3 volume size in GiB.

  LatestWindowsAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-windows-latest/Windows_Server-2022-English-Full-Base
    Description: Public SSM parameter containing the latest Windows Server 2022 AMI.

  InstallerS3Bucket:
    Type: String
    Description: S3 bucket containing the Kiro IDE installer.

  InstallerS3Key:
    Type: String
    Description: S3 object key of the Kiro IDE installer.

  RoleNameDateSuffix:
    Type: String
    AllowedPattern: '^[0-3][0-9][0-1][0-9]$'
    ConstraintDescription: Must be DDMM, for example 2109.
    Description: >
      DDMM suffix appended to IAM role names because CloudFormation cannot
      dynamically calculate the deployment date.

Resources:

  # ---------------------------------------------------------------------------
  # Networking
  # ---------------------------------------------------------------------------

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-kiro-vpc'
        - Key: Environment
          Value: !Ref Environment

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-kiro-igw'

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-kiro-public-subnet'

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-kiro-private-subnet'

  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-kiro-nat-eip'

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-kiro-nat'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-kiro-public-rt'

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-kiro-private-rt'

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  # ---------------------------------------------------------------------------
  # Security group
  #
  # No SecurityGroupIngress property exists at all.
  # Outbound is HTTPS only.
  # ---------------------------------------------------------------------------

  WorkstationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Kiro workstation - zero inbound, HTTPS outbound only
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - Description: HTTPS outbound only
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - Description: DNS over UDP to the VPC resolver
          IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: 10.0.0.2/32
        - Description: DNS over TCP to the VPC resolver
          IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIp: 10.0.0.2/32
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-kiro-workstation-sg'

  # ---------------------------------------------------------------------------
  # Session log bucket
  # ---------------------------------------------------------------------------

  SessionLogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Environment
          Value: !Ref Environment

  SessionLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SessionLogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt SessionLogBucket.Arn
              - !Sub '${SessionLogBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  # ---------------------------------------------------------------------------
  # Administrator secret
  # ---------------------------------------------------------------------------

  AdministratorSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub 'Local Administrator credentials for ${Environment} Kiro workstation'
      GenerateSecretString:
        SecretStringTemplate: '{"username":"Administrator"}'
        GenerateStringKey: password
        PasswordLength: 32

        # Avoid characters that are particularly troublesome when credentials
        # are eventually entered/pasted into Windows/PowerShell tooling.
        # Password still contains upper/lower case, numbers and safe punctuation.
        ExcludeCharacters: '"''`\$&|<>^%{}[]();,=+/\ '
        IncludeSpace: false
        RequireEachIncludedType: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # IAM
  # ---------------------------------------------------------------------------

  WorkstationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Environment}-kiro-workstation-${RoleNameDateSuffix}'
      Path: /
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'

      Policies:

        - PolicyName: !Sub '${Environment}-kiro-installer-read'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListInstallerBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${InstallerS3Bucket}'
                Condition:
                  StringLike:
                    s3:prefix:
                      - !Ref InstallerS3Key

              - Sid: ReadInstaller
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${InstallerS3Bucket}/${InstallerS3Key}'

        - PolicyName: !Sub '${Environment}-kiro-secret-read'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadAdministratorSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref AdministratorSecret

        - PolicyName: !Sub '${Environment}-kiro-session-logs'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteSessionLogs
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub '${SessionLogBucket.Arn}/*'

              - Sid: SessionBucketMetadata
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                Resource: !GetAtt SessionLogBucket.Arn

        - PolicyName: !Sub '${Environment}-kiro-cloudwatch-logs'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudWatchLogDelivery
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                Resource: !Sub '${SessionLogGroup.Arn}:*'

      Tags:
        - Key: Environment
          Value: !Ref Environment

  WorkstationInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - !Ref WorkstationRole

  SessionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/kiro/${Environment}/workstation'
      RetentionInDays: 30
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # EC2
  # ---------------------------------------------------------------------------

  Workstation:
    Type: AWS::EC2::Instance
    DependsOn:
      - PrivateDefaultRoute
    Properties:
      ImageId: !Ref LatestWindowsAmi
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PrivateSubnet
      IamInstanceProfile: !Ref WorkstationInstanceProfile

      SecurityGroupIds:
        - !Ref WorkstationSecurityGroup

      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
        InstanceMetadataTags: enabled

      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref VolumeSize
            Encrypted: true
            DeleteOnTermination: true

      Tags:
        - Key: Name
          Value: !Sub '${Environment}-kiro-workstation'
        - Key: Environment
          Value: !Ref Environment

      UserData:
        Fn::Base64: !Sub |
          <powershell>
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          # ------------------------------------------------------------------
          # Ensure current SSM Agent is installed/running.
          # AWS Windows Server 2022 AMIs normally already contain the agent,
          # but explicitly update it here.
          # ------------------------------------------------------------------

          $ssmInstaller = "$env:TEMP\AmazonSSMAgentSetup.exe"
          $ssmUrl = "https://amazon-ssm-${AWS::Region}.s3.${AWS::Region}.amazonaws.com/latest/windows_amd64/AmazonSSMAgentSetup.exe"

          Invoke-WebRequest -Uri $ssmUrl -OutFile $ssmInstaller -UseBasicParsing
          Start-Process `
            -FilePath $ssmInstaller `
            -ArgumentList "/S" `
            -Wait

          Remove-Item $ssmInstaller -Force -ErrorAction SilentlyContinue

          Set-Service -Name AmazonSSMAgent -StartupType Automatic
          Start-Service -Name AmazonSSMAgent

          # ------------------------------------------------------------------
          # AWS CLI v2
          #
          # Used locally by the password-setting SSM document so that the
          # secret never has to be supplied as an SSM command parameter.
          # ------------------------------------------------------------------

          $awsInstaller = "$env:TEMP\AWSCLIV2.msi"

          Invoke-WebRequest `
            -Uri "https://awscli.amazonaws.com/AWSCLIV2.msi" `
            -OutFile $awsInstaller `
            -UseBasicParsing

          Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$awsInstaller`" /qn /norestart" `
            -Wait

          Remove-Item $awsInstaller -Force -ErrorAction SilentlyContinue

          # ------------------------------------------------------------------
          # Git for Windows
          # ------------------------------------------------------------------

          $gitRelease = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/git-for-windows/git/releases/latest"

          $gitAsset = $gitRelease.assets |
            Where-Object {
              $_.name -match '^Git-[0-9].*-64-bit\.exe$'
            } |
            Select-Object -First 1

          if (-not $gitAsset) {
            throw "Unable to locate current Git for Windows 64-bit installer."
          }

          $gitInstaller = "$env:TEMP\GitSetup.exe"

          Invoke-WebRequest `
            -Uri $gitAsset.browser_download_url `
            -OutFile $gitInstaller `
            -UseBasicParsing

          Start-Process `
            -FilePath $gitInstaller `
            -ArgumentList "/VERYSILENT /NORESTART /NOCANCEL /SP-" `
            -Wait

          Remove-Item $gitInstaller -Force -ErrorAction SilentlyContinue

          # ------------------------------------------------------------------
          # Node.js current LTS
          #
          # Node publishes the active LTS releases in index.json. Select the
          # newest release marked as LTS instead of hardcoding a Node version.
          # ------------------------------------------------------------------

          $nodeIndex = Invoke-RestMethod `
            -Uri "https://nodejs.org/dist/index.json"

          $nodeLts = $nodeIndex |
            Where-Object { $_.lts } |
            Select-Object -First 1

          if (-not $nodeLts) {
            throw "Unable to determine current Node.js LTS release."
          }

          $nodeVersion = $nodeLts.version
          $nodeInstaller = "$env:TEMP\node-lts-x64.msi"
          $nodeUrl = "https://nodejs.org/dist/$nodeVersion/node-$nodeVersion-x64.msi"

          Invoke-WebRequest `
            -Uri $nodeUrl `
            -OutFile $nodeInstaller `
            -UseBasicParsing

          Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$nodeInstaller`" /qn /norestart" `
            -Wait

          Remove-Item $nodeInstaller -Force -ErrorAction SilentlyContinue

          # ------------------------------------------------------------------
          # Windows Firewall logging
          # ------------------------------------------------------------------

          $firewallLog = "$env:SystemRoot\System32\LogFiles\Firewall\pfirewall.log"

          Set-NetFirewallProfile `
            -Profile Domain,Private,Public `
            -LogAllowed True `
            -LogBlocked True `
            -LogFileName $firewallLog `
            -LogMaxSizeKilobytes 32767

          # Fleet Manager Remote Desktop uses the local Windows RDP service
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          </powershell>

  # ---------------------------------------------------------------------------
  # SSM document: Set local Administrator password
  #
  # No password parameter exists.
  # Secret is fetched from Secrets Manager by the instance itself.
  # ---------------------------------------------------------------------------

  SetAdministratorPasswordDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      TargetType: /AWS::EC2::Instance
      Content:
        schemaVersion: '2.2'
        description: Set local Administrator password from Secrets Manager
        mainSteps:
          - action: aws:runPowerShellScript
            name: SetAdministratorPassword
            inputs:
              timeoutSeconds: '300'
              runCommand:
                - !Sub |
                    $ErrorActionPreference = "Stop"
                    $ProgressPreference = "SilentlyContinue"

                    # Do not enable verbose/debug output here.
                    $env:AWS_DEFAULT_REGION = "${AWS::Region}"

                    $aws = "${!env:ProgramFiles}\Amazon\AWSCLIV2\aws.exe"

                    if (-not (Test-Path $aws)) {
                      throw "AWS CLI is not installed."
                    }

                    # Retrieve secret directly on the instance. It is never
                    # supplied to State Manager as a command parameter.
                    $secretJson = & $aws secretsmanager get-secret-value `
                      --secret-id "${AdministratorSecret}" `
                      --region "${AWS::Region}" `
                      --query SecretString `
                      --output text

                    if ($LASTEXITCODE -ne 0) {
                      throw "Unable to retrieve Administrator secret."
                    }

                    $credential = $secretJson | ConvertFrom-Json

                    if (-not $credential.password) {
                      throw "Administrator password was absent from secret."
                    }

                    # Set password without writing the password to stdout.
                    $securePassword = ConvertTo-SecureString `
                      $credential.password `
                      -AsPlainText `
                      -Force

                    Set-LocalUser `
                      -Name "Administrator" `
                      -Password $securePassword

                    # Clear plaintext-bearing variables immediately.
                    $credential.password = $null
                    $credential = $null
                    $secretJson = $null
                    $securePassword = $null

                    [GC]::Collect()

  SetAdministratorPasswordAssociation:
    Type: AWS::SSM::Association
    DependsOn:
      - Workstation
      - SetAdministratorPasswordDocument
    Properties:
      AssociationName: !Sub '${Environment}-kiro-set-admin-password'
      Name: !Ref SetAdministratorPasswordDocument
      Targets:
        - Key: InstanceIds
          Values:
            - !Ref Workstation
      MaxConcurrency: '1'
      MaxErrors: '0'
      WaitForSuccessTimeoutSeconds: 900

  # ---------------------------------------------------------------------------
  # SSM document: Stage Kiro IDE installer
  # ---------------------------------------------------------------------------

  StageKiroInstallerDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      TargetType: /AWS::EC2::Instance
      Content:
        schemaVersion: '2.2'
        description: Copy Kiro IDE installer to the Public Desktop
        mainSteps:
          - action: aws:runPowerShellScript
            name: StageKiroInstaller
            inputs:
              timeoutSeconds: '900'
              runCommand:
                - !Sub |
                    $ErrorActionPreference = "Stop"
                    $ProgressPreference = "SilentlyContinue"

                    $aws = "${!env:ProgramFiles}\Amazon\AWSCLIV2\aws.exe"

                    if (-not (Test-Path $aws)) {
                      throw "AWS CLI is not installed."
                    }

                    $sourceKey = "${InstallerS3Key}"
                    $fileName = [IO.Path]::GetFileName($sourceKey)

                    if ([string]::IsNullOrWhiteSpace($fileName)) {
                      throw "InstallerS3Key must identify an object, not a prefix."
                    }

                    $destination = Join-Path `
                      "${!env:PUBLIC}\Desktop" `
                      $fileName

                    & $aws s3 cp `
                      "s3://${InstallerS3Bucket}/${InstallerS3Key}" `
                      $destination `
                      --region "${AWS::Region}" `
                      --only-show-errors

                    if ($LASTEXITCODE -ne 0) {
                      throw "Failed to copy Kiro IDE installer from S3."
                    }

  StageKiroInstallerAssociation:
    Type: AWS::SSM::Association
    DependsOn:
      - Workstation
      - StageKiroInstallerDocument
    Properties:
      AssociationName: !Sub '${Environment}-kiro-stage-installer'
      Name: !Ref StageKiroInstallerDocument
      Targets:
        - Key: InstanceIds
          Values:
            - !Ref Workstation
      MaxConcurrency: '1'
      MaxErrors: '0'
      WaitForSuccessTimeoutSeconds: 900

  # ---------------------------------------------------------------------------
  # SSM document: Create HKLM RunOnce entry for Kiro CLI
  #
  # The document itself runs as SYSTEM through SSM. It only plants the
  # RunOnce command. Windows executes that command at interactive logon.
  # RunOnce automatically deletes the value before executing it.
  # ---------------------------------------------------------------------------

  ConfigureKiroCliRunOnceDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      TargetType: /AWS::EC2::Instance
      Content:
        schemaVersion: '2.2'
        description: Configure first-logon Kiro CLI installation
        mainSteps:
          - action: aws:runPowerShellScript
            name: ConfigureKiroCliRunOnce
            inputs:
              timeoutSeconds: '120'
              runCommand:
                - |
                    $ErrorActionPreference = "Stop"

                    $runOncePath = "HKLM:\Software\Microsoft\Windows\CurrentVersion\RunOnce"

                    # Explicit PowerShell executable avoids dependence on
                    # file associations or shell interpretation.
                    #
                    # TLS 1.2 is selected before irm.
                    # irm = Invoke-RestMethod
                    # iex = Invoke-Expression
                    $command = 'powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12; irm https://cli.kiro.dev/install.ps1 | iex"'

                    New-ItemProperty `
                      -Path $runOncePath `
                      -Name "InstallKiroCLI" `
                      -PropertyType String `
                      -Value $command `
                      -Force | Out-Null

  ConfigureKiroCliRunOnceAssociation:
    Type: AWS::SSM::Association
    DependsOn:
      - Workstation
      - ConfigureKiroCliRunOnceDocument
    Properties:
      AssociationName: !Sub '${Environment}-kiro-cli-runonce'
      Name: !Ref ConfigureKiroCliRunOnceDocument
      Targets:
        - Key: InstanceIds
          Values:
            - !Ref Workstation
      MaxConcurrency: '1'
      MaxErrors: '0'
      WaitForSuccessTimeoutSeconds: 900

Outputs:

  InstanceId:
    Description: EC2 instance ID of the Kiro workstation
    Value: !Ref Workstation

  FleetManagerUrl:
    Description: AWS Systems Manager Fleet Manager page for the workstation
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/systems-manager/managed-instances/${Workstation}/overview?region=${AWS::Region}'

  VpcId:
    Description: VPC ID
    Value: !Ref VPC

  SessionLogBucketName:
    Description: S3 bucket reserved for Systems Manager session logs
    Value: !Ref SessionLogBucket

  AdministratorSecretArn:
    Description: ARN of the Secrets Manager Administrator credential
    Value: !Ref AdministratorSecret

  AdministratorSecretConsoleUrl:
    Description: AWS Secrets Manager console link for the Administrator credential
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/secretsmanager/secret?name=${AdministratorSecret}&region=${AWS::Region}'